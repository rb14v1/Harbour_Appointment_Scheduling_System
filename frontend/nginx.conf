server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://manojappointment-72722-backend.greenstone-461202ba.southindia.azurecontainerapps.io;
        proxy_ssl_server_name on;
        proxy_set_header Host manojappointment-72722-backend.greenstone-461202ba.southindia.azurecontainerapps.io;

        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
